name: Setup
description: Setup pnpm and Node.js, and install dependencies

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      with:
        cache: true
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Setup Socket Firewall
      uses: socketdev/action@937f824ec476dfd164d4a4d9995751427b0be143 # v1
      with:
        mode: firewall
    - name: Install dependencies
      run: sfw pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
